name: Build and deploy DIO to DIO

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "metadata/**"
      - "reports/markdown/**"
      - "reports/pdf/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install --yes pandoc
      - name: Build static website
        run: python3 scripts/build.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published report pages and metadata
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          paths=(
            ""
            "analyses/brave-ai.html"
            "analyses/chatgpt.html"
            "analyses/deepseek.html"
            "analyses/gemini-deep-research.html"
            "analyses/gemini-pro-latest.html"
            "analyses/leo-ai.html"
            "analyses/lumo.html"
            "analyses/mistral.html"
            "analyses/qwen.html"
            "analyses/grok.html"
            "analyses/claude.html"
            "resolved-artifact-metadata.json"
            "keyword-registry.resolved.json"
            "llms.txt"
          )
          for path in "${paths[@]}"; do
            curl --fail --location --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors --output /dev/null "${SITE_URL}${path}"
          done
          curl --fail --location --silent --show-error "${SITE_URL}resolved-artifact-metadata.json" | python3 -c '
          import json, sys
          manifest = json.load(sys.stdin)
          registry = manifest.get("keyword_registry", {})
          version = tuple(int(part) for part in registry.get("registry_version", "").split("."))
          assert registry.get("status") == "canonical-approved", "Keyword registry is not canonical-approved."
          assert len(version) == 3 and version[0] == 2 and version >= (2, 10, 0), f"Unsupported keyword registry version: {registry.get('registry_version')!r}"
          assert any(item.get("page_key") == "claude" for item in manifest.get("artifacts", [])), "Claude report is missing from the resolved manifest."
          print(f"Verified canonical keyword registry {registry['registry_version']} and Claude report.")
          '
